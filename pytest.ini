[pytest]
testpaths = tests
markers =
	gpu: tests that need CUDA-capable torch (skipped automatically without CUDA; deselect in CI with -m "not gpu")
addopts = -ra --strict-markers --cov=pyRTC.utils --cov=pyRTC.pyRTCComponent --cov=pyRTC.WavefrontCorrector --cov=pyRTC.ScienceCamera --cov=pyRTC.Telemetry --cov=pyRTC.Modulator --cov=pyRTC.Optimizer --cov=pyRTC.streams --cov=pyRTC.rpc --cov=pyRTC.component_loading --cov=pyRTC.latency --cov-report=term-missing --cov-report=xml --cov-fail-under=80
filterwarnings =
	ignore:The NumPy module was reloaded \(imported a second time\).*:UserWarning:matplotlib\.cbook
