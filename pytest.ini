[pytest]
testpaths = tests
markers =
	gpu: tests that need CUDA-capable torch (skipped automatically without CUDA; deselect in CI with -m "not gpu")
addopts = -ra --strict-markers --cov=pyrtc.utils --cov=pyrtc.component --cov=pyrtc.wavefront_corrector --cov=pyrtc.science_camera --cov=pyrtc.telemetry --cov=pyrtc.modulator --cov=pyrtc.optimizer --cov=pyrtc.streams --cov=pyrtc.rpc --cov=pyrtc.component_loading --cov=pyrtc.latency --cov-report=term-missing --cov-report=xml --cov-fail-under=80
filterwarnings =
	ignore:The NumPy module was reloaded \(imported a second time\).*:UserWarning:matplotlib\.cbook
