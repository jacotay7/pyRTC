[pytest]
testpaths = tests
markers =
	gpu: tests that need CUDA-capable torch (skipped automatically without CUDA; deselect in CI with -m "not gpu")
addopts = -ra --strict-markers --cov=pyrtc --cov-report=term-missing --cov-report=xml --cov-fail-under=70
filterwarnings =
	error:The NumPy module was reloaded:UserWarning
