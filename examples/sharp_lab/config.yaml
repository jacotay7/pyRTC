wfc:
  name: "ALPAO"
  serial: "BAX118"
  num_actuators: 97
  num_modes: 94
  flat_file: "/home/whetstone/pyrtc/examples/sharp_lab/calib/wfc_shape.npy"
  save_file: "/home/whetstone/pyrtc/examples/sharp_lab/calib/wfc_shape.npy"
  m2c_file:  "/home/whetstone/pyrtc/examples/sharp_lab/calib/m2c_kl.npy" 
  floating_actuators_file: ""
  floating_influence_radius: 1
  affinity: 5
  command_cap: 0.8
  frame_delay: 0
  class_name: ALPAODM
  input_streams: {}
  output_streams:
    wfc: wfc
    wfc_2d: wfc_2d
  functions:
  - send_to_hardware

psf:
  name: "FLIR"
  index: 0
  exposure: 300
  gain: 0
  bit_depth: 16
  left: 936
  top: 448
  width: 128
  height: 128
  dark_count: 2000
  dark_file: "/home/whetstone/pyrtc/examples/sharp_lab/calib/psfDark.npy"
  model_file: "/home/whetstone/pyrtc/examples/sharp_lab/calib/model_psf.npy"
  integration: 1
  affinity: 6
  class_name: SpinCam
  input_streams: {}
  output_streams:
    psf_short: psf_short
    psf_long: psf_long
    strehl: strehl
    tiptilt: tiptilt
  functions:
  - expose
  - integrate
  - compute_strehl

optimizer:
  ncpa:
    name: "NCPA"
    num_steps: 100
    start_mode: 0
    end_mode: 40
    correction_mag: 0.003
    num_reads: 1
    affinity: 10
  pid:
    name: "PID"
    num_steps: 100
    max_p_gain: 0.5
    max_i_gain: 0.1
    max_d_gain: 0.1
    num_reads: 1
    affinity: 10
  loop:
    name: "hyper"
    num_steps: 100
    min_gain: 0.3
    max_gain: 0.6
    max_leak: 0.05
    max_dropped_modes: 30
    num_reads: 1
    affinity: 10

