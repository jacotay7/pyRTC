loop:
  gain: 0.425
  leaky_gain: 0.026
  num_dropped_modes: 14
  poke_amp: 0.02
  num_iters_im: 50
  affinity: 2
  delay: 2
  method: push-pull
  im_file: "/home/whetstone/pyrtc/examples/sharp_lab/calib/IM.npy"
  p_gain: 0.28
  i_gain: 0.066
  d_gain: 0.078
  control_limits: [-0.05, 0.05]
  absolute_limits: [-0.3, 0.3]
  integral_limits: [-0.1, 0.1]
  derivative_filter: 0.1
  hardware_delay: 0.001 #seconds
  class_name: Loop
  input_streams:
    signal: signal
  output_streams:
    wfc: wfc
  functions:
  # - standard_integrator
  # - standard_integrator_pol
  - leaky_integrator
  # - pid_integrator_pol
  # - pid_integrator


wfs:
  name: XIMEA
  serial: "46052550"
  binning: 1 
  exposure: 2500
  gain: 0
  bit_depth: 10
  left: 400 #416 
  top: 270 
  width: 400 
  height: 400 
  dark_count: 2000
  dark_file: "/home/whetstone/pyrtc/examples/sharp_lab/calib/dark.npy"
  affinity: 3
  class_name: XIMEA_WFS
  input_streams: {}
  output_streams:
    wfs_raw: wfs_raw
    wfs: wfs
  functions:
  - expose

slopes:
  type: SHWFS
  signal_type: slopes
  ref_slopes_file: "/home/whetstone/pyrtc/examples/sharp_lab/calib/ref.npy"
  valid_sub_aps_file: "/home/whetstone/pyrtc/examples/sharp_lab/calib/valid_sub_aps.npy"
  sub_ap_spacing: 15.54 #7.78
  sub_ap_offset_x: 13
  sub_ap_offset_y: 3
  image_noise: 1.3
  contrast: 6
  affinity: 4
  class_name: SlopesProcess
  input_streams:
    wfs: wfs
  output_streams:
    signal: signal
    signal_2d: signal_2d
  functions:
  - compute_signal
