specula:
  class_name: pyrtc.hardware.specula_interface.SPECULAInterface
  class_file: ../../pyrtc/hardware/specula_interface.py
  param_file: shwfs_SPECULA_params.yaml
  wfc_section: wfc
  use_atmosphere: false
  input_streams: {}
  output_streams: {}
loop:
  gain: 0.1
  leaky_gain: 0.01
  num_dropped_modes: 0
  poke_amp: 100
  num_iters_im: 8
  conditioning: 10
  affinity: 2
  method: push-pull
  class_name: Loop
  input_streams:
    signal: signal
  output_streams:
    wfc: wfc
  functions:
  - leaky_integrator
  class_file: ../../pyrtc/loop.py
wfs:
  name: SPECULASH
  width: 160
  height: 160
  dark_count: 16
  affinity: 3
  class_name: pyrtc.hardware.specula_interface.SPECULAWFSensor
  resource: specula
  input_streams: {}
  output_streams:
    wfs_raw: wfs_raw
    wfs: wfs
  functions:
  - expose
  class_file: ../../pyrtc/hardware/specula_interface.py
slopes:
  type: SHWFS
  signal_type: slopes
  affinity: 4
  contrast: 0.0
  sub_ap_spacing: 8
  sub_ap_offset_x: 0
  sub_ap_offset_y: 0
  class_name: SlopesProcess
  input_streams:
    wfs: wfs
  output_streams:
    signal: signal
    signal_2d: signal_2d
  functions:
  - compute_signal
  class_file: ../../pyrtc/slopes_process.py
wfc:
  name: SPECULADM
  num_actuators: 400
  num_modes: 54
  flat_file: ''
  save_file: specula_flat.npy
  m2c_file: ''
  affinity: 3
  hardware_delay: 0.001
  frame_delay: 0
  class_name: pyrtc.hardware.specula_interface.SPECULAWFCorrector
  resource: specula
  input_streams:
    wfc: wfc
  output_streams:
    wfc: wfc
    wfc_2d: wfc_2d
  functions:
  - send_to_hardware
  class_file: ../../pyrtc/hardware/specula_interface.py
psf:
  name: SPECULAPSF
  width: 160
  height: 160
  dark_count: 1
  integration: 4
  affinity: 5
  class_name: pyrtc.hardware.specula_interface.SPECULAScienceCamera
  resource: specula
  input_streams: {}
  output_streams:
    psf_short: psf_short
    psf_long: psf_long
    strehl: strehl
    tiptilt: tiptilt
  functions:
  - expose
  - integrate
  class_file: ../../pyrtc/hardware/specula_interface.py
manager:
  mode: soft-rtc
  component_classes:
    specula: pyrtc.hardware.specula_interface.SPECULAInterface
    loop: pyrtc.loop.Loop
    wfs: pyrtc.hardware.specula_interface.SPECULAWFSensor
    slopes: pyrtc.slopes_process.SlopesProcess
    wfc: pyrtc.hardware.specula_interface.SPECULAWFCorrector
    psf: pyrtc.hardware.specula_interface.SPECULAScienceCamera
  component_files:
    specula: ../../pyrtc/hardware/specula_interface.py
    loop: ../../pyrtc/loop.py
    wfs: ../../pyrtc/hardware/specula_interface.py
    slopes: ../../pyrtc/slopes_process.py
    wfc: ../../pyrtc/hardware/specula_interface.py
    psf: ../../pyrtc/hardware/specula_interface.py
metadata: {}
streams: {}
resources: {}