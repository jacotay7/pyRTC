name: ISIO Bridge

# Builds ImageStreamIO (milk/CACAO shared memory) and runs the pyrtc <-> ISIO
# bridge tests against it (#54). They skip everywhere ImageStreamIO is absent.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev

jobs:
  isio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pyrtc and ImageStreamIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pip install git+https://github.com/milk-org/ImageStreamIO

      - name: Run the ISIO bridge tests
        run: pytest -q --no-cov tests/test_isio_bridge.py -rs
